name-template: "$RESOLVED_VERSION"
tag-template: "$RESOLVED_VERSION"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
sort-direction: ascending

categories:
  # 1. Version Resolver Categories (New Schema)
  - type: "version-resolver"
    when:
      labels:
        - "breaking-change"
    semver-increment: "major"

  - type: "version-resolver"
    when:
      labels:
        - "feature"
        - "feat"
        - "enhancement"
    semver-increment: "minor"

  - type: "version-resolver"
    when:
      labels:
        - "fix"
        - "bug"
        - "docs"
        - "documentation"
        - "chore"
        - "refactor"
        - "ci"
        - "dependencies"
    semver-increment: "patch"

  - type: "version-resolver"
    semver-increment: "patch" # Default fallback

  # 2. Changelog Grouping Categories (Updated 'when' syntax)
  - title: '✨ Enhancements'
    when:
      labels:
        - 'enhancement'
  - title: '🚀 Features'
    when:
      labels:
        - 'feature'
        - 'feat'
  - title: '🐛 Bug Fixes'
    when:
      labels:
        - 'fix'
        - 'bug'
  - title: '📖 Documentation'
    when:
      labels:
        - 'docs'
        - 'documentation'
  - title: '🧰 Maintenance'
    when:
      labels:
        - 'chore'
        - 'refactor'
        - 'ci'
  - title: '📦 Dependencies'
    collapse-after: 2
    when:
      labels:
        - 'dependencies'

autolabeler:
  - label: 'feature'
    title:
      - '/^feat(\\(.+\\))?:/i'
  - label: 'fix'
    title:
      - '/^fix(\\(.+\\))?:/i'
  - label: 'docs'
    title:
      - '/^docs(\\(.+\\))?:/i'
  - label: 'chore'
    title:
      - '/^chore(\\(.+\\))?:/i'
  - label: 'refactor'
    title:
      - '/^refactor(\\(.+\\))?:/i'
  - label: 'ci'
    title:
      - '/^ci(\\(.+\\))?:/i'
      - '/^build(\\(.+\\))?:/i'
  - label: 'enhancement'
    title:
      - '/^perf(\\(.+\\))?:/i'
  - label: 'chore'
    title:
      - '/^style(\\(.+\\))?:/i'
      - '/^test(\\(.+\\))?:/i'
  - label: 'dependencies'
    title:
      - '/^build\\(deps\\)(\\(.+\\))?:/i'
      - '/^deps(\\(.+\\))?:/i'

template: |
  ## Changes
  $CHANGES
