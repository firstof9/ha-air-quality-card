name: Autolabeler
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - edited
permissions: {}
concurrency:
  group: ${{ format('al-{0}-pr-{1}', github.event_name, github.event.pull_request.number) }}
  cancel-in-progress: true
jobs:
  autolabel:
    name: Autolabel PR
    if: '(github.event_name == ''pull_request_target'' && github.event.pull_request.head.repo.fork)
      || (github.event_name == ''pull_request'' && !github.event.pull_request.head.repo.fork)'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
    - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.19.4
      with:
        egress-policy: audit
    - uses: release-drafter/release-drafter@ed4bc48ec97379be2258e7b7ac2624a3e26ab809 # v7.4.0
