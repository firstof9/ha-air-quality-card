name: Lint PR title
true:
  pull_request_target:
    types:
    - opened
    - edited
    - synchronize
permissions:
  contents: read
  pull-requests: read
jobs:
  main:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
    - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
      with:
        egress-policy: audit
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
