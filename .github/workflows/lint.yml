name: Lint
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
    - &id001
      uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.19.4
      with:
        egress-policy: audit
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.1.0
      with:
        node-version: '22'
    - run: npm ci
    - run: npm run typecheck
  build:
    name: Bundle build
    runs-on: ubuntu-latest
    steps:
    - *id001
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.1.0
      with:
        node-version: '22'
    - run: npm ci
    - run: npm run build
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
    - *id001
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      with:
        fetch-depth: 0
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.1.0
      with:
        node-version: '22'
    - run: npm ci
    - run: npm test
