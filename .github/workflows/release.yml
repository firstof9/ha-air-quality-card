name: Release
true:
  release:
    types:
    - published
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to upload assets to
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    name: Build and upload release asset
    runs-on: ubuntu-latest
    steps:
    - uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d
      with:
        egress-policy: audit
    - name: Checkout
      uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
      with:
        node-version: '22'
    - run: npm ci
    - run: npm run build
      env:
        CARD_VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name
          }}
    - name: Upload card bundle
      uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
      with:
        files: air-quality-card.js
        tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
